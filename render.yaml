# DBは既存の無料PostgreSQL「mysite」を使う（無料DBはワークスペースに1つまでのため）
services:
  - type: web
    name: L6
    runtime: ruby
    plan: free
    region: oregon
    buildCommand: bash bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mysite
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 0
