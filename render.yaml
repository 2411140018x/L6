databases:
  - name: l6-db
    databaseName: l6
    user: l6
    plan: free
    region: oregon

services:
  - type: web
    name: L6
    runtime: ruby
    plan: free
    region: oregon
    buildCommand: bash bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: l6-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 0
